<div class="error-page-container">
  <div class="error-card shadow-lg text-center">
    <div class="error-glitch-wrapper mb-4">
      <h1 class="error-code">500</h1>
      <div class="error-glow"></div>
    </div>
    
    <div class="error-icon-wrapper mb-3">
      <i class="fas fa-server fa-3x text-danger animate-pulse"></i>
    </div>

    <h2 class="error-title">Erreur Interne du Serveur</h2>
    <p class="error-message">
      Oups ! Quelque chose s'est mal passé du côté du serveur. Nos équipes sont sur le coup.
    </p>

    <div class="error-actions mt-4 d-flex justify-content-center gap-3">
      <button class="btn btn-outline-danger btn-lg px-4" (click)="reload()">
        <i class="fas fa-sync-alt me-2"></i>Réessayer
      </button>
      <button class="btn btn-danger btn-lg px-4" (click)="goHome()">
        <i class="fas fa-home me-2"></i>Retour à l'Accueil
      </button>
    </div>
  </div>
</div>
