<section id="experience" class="timeline-section">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header text-center mb-5">
      <div class="section-badge mb-2">
        <span class="badge-pill"><i class="fas fa-history me-1"></i> Mon Parcours</span>
      </div>
      <h2 class="section-title">{{ 'TIMELINE.TITLE' | translate }}</h2>
      <div class="title-underline"></div>
    </div>

    <div class="timeline-wrapper">
      <!-- Central Line -->
      <div class="timeline-line"></div>

      <!-- Experience Items -->
      <div class="timeline-items">
        <div *ngFor="let item of experiences; let i = index" 
             class="timeline-item" 
             [ngClass]="i % 2 === 0 ? 'left' : 'right'">
          
          <!-- Timeline Dot Icon -->
          <div class="timeline-dot" [title]="item.title">
            <i [class]="item.icon"></i>
            <div class="dot-glow"></div>
          </div>

          <!-- Timeline Content Card -->
          <div class="timeline-content">
            <div class="timeline-card shadow-lg">
              <!-- Date Badge -->
              <div class="card-header-meta d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                <span class="date-badge">
                  <i class="far fa-calendar-alt me-1"></i> {{ item.period }}
                </span>
                <span class="type-pill experience-pill">
                  <i class="fas fa-briefcase me-1"></i> Expérience
                </span>
              </div>

              <!-- Title & Subtitle -->
              <h3 class="timeline-title">{{ item.title }}</h3>
              
              <div class="timeline-meta-row d-flex align-items-center flex-wrap gap-2 mb-3">
                <div class="company-chip">
                  <i class="fas fa-building me-1 text-danger"></i>
                  <strong>{{ item.subtitle }}</strong>
                </div>
                <div class="location-chip" *ngIf="item.location">
                  <i class="fas fa-map-marker-alt me-1 text-danger"></i>
                  <span>{{ item.location }}</span>
                </div>
              </div>

              <!-- Bullet Points Description -->
              <ul class="timeline-description-list" *ngIf="item.description && item.description.length > 0">
                <li *ngFor="let desc of item.description" class="desc-item">
                  <span class="bullet-arrow"><i class="fas fa-chevron-right"></i></span>
                  <span class="desc-text">{{ desc }}</span>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <!-- Education Divider -->
        <div class="timeline-divider text-center my-5">
          <div class="divider-line"></div>
          <span class="divider-badge shadow-sm">
            <i class="fas fa-graduation-cap me-2 text-danger"></i>
            {{ 'TIMELINE.EDUCATION' | translate }}
          </span>
          <div class="divider-line"></div>
        </div>

        <!-- Education Items -->
        <div *ngFor="let item of education; let index = index" 
             class="timeline-item" 
             [ngClass]="(index + experiences.length) % 2 === 0 ? 'left' : 'right'">
          
          <div class="timeline-dot education-dot" [title]="item.title">
            <i [class]="item.icon"></i>
            <div class="dot-glow education-glow"></div>
          </div>

          <div class="timeline-content">
            <div class="timeline-card education-card shadow-lg">
              <div class="card-header-meta d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                <span class="date-badge edu-date-badge">
                  <i class="far fa-calendar-alt me-1"></i> {{ item.period }}
                </span>
                <span class="type-pill education-pill">
                  <i class="fas fa-graduation-cap me-1"></i> Formation
                </span>
              </div>

              <h3 class="timeline-title">{{ item.title }}</h3>

              <div class="timeline-meta-row d-flex align-items-center flex-wrap gap-2 mb-2">
                <div class="company-chip">
                  <i class="fas fa-university me-1 text-danger"></i>
                  <strong>{{ item.subtitle }}</strong>
                </div>
                <div class="location-chip" *ngIf="item.location">
                  <i class="fas fa-map-marker-alt me-1 text-danger"></i>
                  <span>{{ item.location }}</span>
                </div>
              </div>

              <ul class="timeline-description-list" *ngIf="item.description && item.description.length > 0">
                <li *ngFor="let desc of item.description" class="desc-item">
                  <span class="bullet-arrow"><i class="fas fa-chevron-right"></i></span>
                  <span class="desc-text">{{ desc }}</span>
                </li>
              </ul>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
